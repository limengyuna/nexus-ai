# NexusAI 完整服务编排
# 一键启动：docker compose up -d
# 访问：
#   前端 UI       → http://localhost
#   后端 Swagger  → http://localhost:8002/docs
#   Chroma        → http://localhost:8001

services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_ai
    ports:
      - "5432:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - nexus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: nexus-chroma
    ports:
      - "8001:8000"
    volumes:
      - nexus-chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------- NexusAI 后端 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    environment:
      # 数据库（对应 config.py 中的 POSTGRES_* 字段）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_ai
      # Redis（对应 config.py 中的 REDIS_HOST）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Chroma（HTTP 模式）
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      # 应用基础
      APP_NAME: NexusAI
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-me-in-prod}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # LLM / Embedding 凭证（必须在 .env 中提供）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?需要在 .env 中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?需要在 .env 中设置 DASHSCOPE_API_KEY}
      LLM_PROVIDER: deepseek
      EMBEDDING_PROVIDER: tongyi
      # CORS
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://frontend"
    ports:
      - "8002:8000"
    volumes:
      - nexus-uploads:/app/data/uploads  # 上传的文档持久化
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    # 启动前自动跑 alembic 迁移
    command: >
      sh -c "alembic upgrade head &&
             python main.py"
    restart: unless-stopped

  # ---------- Celery Worker（异步文档处理）----------
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-celery
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_ai
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      APP_NAME: NexusAI
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-me-in-prod}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?需要在 .env 中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?需要在 .env 中设置 DASHSCOPE_API_KEY}
      LLM_PROVIDER: deepseek
      EMBEDDING_PROVIDER: tongyi
    volumes:
      - nexus-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped

  # ---------- NexusAI 前端（nginx 静态托管 + /api 反代 backend）----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# ---------- 持久化卷 ----------
volumes:
  nexus-postgres-data:
  nexus-redis-data:
  nexus-chroma-data:
  nexus-uploads:
