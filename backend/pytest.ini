[pytest]
# pytest 配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持（pytest-asyncio）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 抑制部分第三方库的弃用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 简化输出
addopts = -v --tb=short --color=yes
