# NexusAI 前端 nginx 配置
# - 静态文件托管 + SPA history 路由 fallback
# - /api 反向代理到后端服务（容器内通过服务名 backend 解析）
# - SSE 关键：禁用代理缓冲

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小限制（知识库文档上传）
    client_max_body_size 50m;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API 反向代理 ----------
    location /api/ {
        # 后端地址通过环境变量 BACKEND_URL 注入（容器启动时 envsubst 替换）
        # 本地 docker-compose: http://backend:8000；Railway: http://nexus-ai.railway.internal:8002
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        
        # 🛡️ 核心修复 1：将传递的 Host 修正为目标的真实 Host，防止 Railway 网关因 Host 冲突抛出 404
        proxy_set_header Host $proxy_host;
        
        # 🛡️ 核心修复 2：开启 SSL 的 SNI 握手传送，防止 Railway 网关因缺失 SNI 丢弃握手抛出 502
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须：关闭缓冲、保持连接、不超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ---------- SPA 路由 fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
